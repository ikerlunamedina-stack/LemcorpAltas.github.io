<div class="tabs">
  <button onclick="mostrarTab('nuevo')">Nuevo Pedido</button>
  <button onclick="mostrarTab('historial')">Historial</button>
</div>

<div id="nuevo" class="tab-content">
  <!-- Aquí va tu formulario de pedidos -->
  <input type="text" id="nombre" placeholder="Nombre del técnico"><br><br>
  <div id="productos"></div>
  <textarea id="adicional" placeholder="Mensaje adicional..." style="width:100%;height:60px;"></textarea><br>
  <button class="enviar" onclick="guardarPedido()">Guardar Pedido</button>
</div>

<div id="historial" class="tab-content" style="display:none;">
  <!-- Aquí se mostrarán los pedidos guardados -->
  <h2>Historial de pedidos</h2>
  <ul id="lista-pedidos"></ul>
</div>

<script>
function mostrarTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(div => {
    div.style.display = 'none';
  });
  document.getElementById(tabId).style.display = 'block';
}

// Ejemplo: cargar historial desde localStorage
function cargarHistorial() {
  const lista = document.getElementById("lista-pedidos");
  lista.innerHTML = "";
  let pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
  pedidos.forEach(p => {
    const li = document.createElement("li");
    li.textContent = `${p.fecha} - ${p.tecnico}: ${p.materiales.join(", ")}`;
    lista.appendChild(li);
  });
}
</script>
